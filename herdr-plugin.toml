id = "jtblink.herdr-work"
name = "HerdrWork"
version = "0.1.9"
min_herdr_version = "0.9.3"
description = "Tasks, agents, files, Git and code review in one HerdrWork terminal."
platforms = ["macos", "linux"]

[[build]]
command = ["python3", "scripts/plugin_build.py"]

[[panes]]
id = "pane"
title = "HerdrWork"
placement = "split"
command = ["bin/herdr-work", "ui", "--sidebar"]

[[panes]]
id = "board"
title = "HerdrWork Projects"
placement = "tab"
command = ["bin/herdr-work-projects", "board"]

[[startup]]
command = ["python3", "scripts/hook.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "scripts/hook.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "scripts/hook.py"]

[[events]]
on = "pane.closed"
command = ["python3", "scripts/hook.py"]

[[events]]
on = "worktree.removed"
command = ["python3", "scripts/hook.py"]

# Background actions ask the host to allocate or focus this product's terminal.

[[actions]]
id = "show-explorer"
title = "Show HerdrWork Explorer"
command = ["bin/herdr-work", "activate", "show-explorer"]

[[actions]]
id = "show-search"
title = "Show HerdrWork Search"
command = ["bin/herdr-work", "activate", "show-search"]

[[actions]]
id = "show-git"
title = "Show HerdrWork Source Control"
command = ["bin/herdr-work", "activate", "show-git"]

[[actions]]
id = "quick-open"
title = "HerdrWork Quick Open"
command = ["bin/herdr-work", "activate", "quick-open"]

[[actions]]
id = "toggle"
title = "Toggle HerdrWork Sidebar"
command = ["bin/herdr-work", "activate", "toggle"]

[[startup]]
command = ["bin/herdr-work", "sidebar-ensure"]

[[events]]
on = "tab.created"
command = ["bin/herdr-work", "sidebar-ensure"]

[[events]]
on = "workspace.created"
command = ["bin/herdr-work", "sidebar-ensure"]
