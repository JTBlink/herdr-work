id = "jtblink.herdr-work"
name = "HerdrWork"
version = "0.1.6"
min_herdr_version = "0.9.3"
description = "Tasks, agents, files, Git and code review in one HerdrWork terminal."
platforms = ["macos", "linux"]

[[build]]
command = ["python3", "scripts/plugin.py"]

[[panes]]
id = "pane"
title = "HerdrWork"
placement = "tab"
command = ["bin/herdr-work", "ui", "."]

[[startup]]
command = ["python3", "scripts/hook.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "scripts/hook.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "scripts/hook.py"]

[[events]]
on = "pane.closed"
command = ["python3", "scripts/hook.py"]

[[events]]
on = "worktree.removed"
command = ["python3", "scripts/hook.py"]
