name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: herdr-work-*
          merge-multiple: true
          path: dist
      - name: Verify all platforms, stage release, upload, publish last
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py --assets dist
