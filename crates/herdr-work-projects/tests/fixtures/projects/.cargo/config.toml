# How the builds on Linux link: the C compiler is given scripts/ld/, where it finds scripts/linker.sh as its `ld`: mold
# when it is installed (the workspace setup installs it), the linker Rust uses by itself when it is not, and for release
# builds. On x86_64 it is also told not to ask for Rust's own lld, its default there; that flag is unstable on every
# other target (aarch64 Linux fails at once with it), where the C compiler's own `ld` is already the default. The words
# are the same in every worktree, so a build copied from another one (scripts/warm-start.sh) and the shared build cache
# stay good. macOS keeps Apple's own linker. A test runs rustc with each target's flags (tests/linking.rs).
# docs/linking.md.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clinker-features=-lld", "-Clink-arg=-Bscripts/ld/"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-Bscripts/ld/"]
