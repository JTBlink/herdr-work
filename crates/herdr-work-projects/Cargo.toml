[package]
name = "herdr-work-projects"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "herdr_work_tasks"

[features]
default = []
reference-ui = []

[[bin]]
name = "herdr-work-projects-reference"
path = "tests/support/reference.rs"
required-features = ["reference-ui"]

[[test]]
name = "source"
path = "tests/source/main.rs"
required-features = ["reference-ui"]

[target.'cfg(unix)'.dependencies]
sw-web = { package = "herdr-work-task-web", path = "../herdr-work-task-web" }
regex.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dev-dependencies]
chrono.workspace = true
crossterm.workspace = true
fancy-regex.workspace = true
libc.workspace = true
ratatui.workspace = true
