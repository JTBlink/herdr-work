[workspace]
members = ["crates/herdr-work-core", "crates/herdr-work-engine", "crates/herdr-work-tui", "crates/herdr-work", "crates/herdr-work-projects", "crates/herdr-work-code"]
exclude = ["upstream/herdr-projects", "upstream/herdr-reviewr"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
herdr-work-code = { path = "crates/herdr-work-code" }
herdr-work-core = { path = "crates/herdr-work-core" }
herdr-work-engine = { path = "crates/herdr-work-engine" }
herdr-work-tui = { path = "crates/herdr-work-tui" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
