[workspace]
members = ["crates/workdesk-core", "crates/workdesk-engine", "crates/workdesk-tui", "crates/workdesk"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
workdesk-core = { path = "crates/workdesk-core" }
workdesk-engine = { path = "crates/workdesk-engine" }
workdesk-tui = { path = "crates/workdesk-tui" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
