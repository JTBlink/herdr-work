[workspace]
members = [
    "crates/herdr-work-core",
    "crates/herdr-work-engine",
    "crates/herdr-work-tui",
    "crates/herdr-work",
    "crates/herdr-work-projects",
    "crates/herdr-work-code",
    "crates/herdr-work-task-data",
    "crates/herdr-work-task-flow",
    "crates/herdr-work-task-board",
    "crates/herdr-work-task-web",
]
resolver = "3"

[workspace.package]
version = "0.1.15"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

[workspace.dependencies]
herdr-work-code = { path = "crates/herdr-work-code" }
herdr-work-core = { path = "crates/herdr-work-core" }
herdr-work-engine = { path = "crates/herdr-work-engine" }
herdr-work-tui = { path = "crates/herdr-work-tui" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }

unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
regex = "1"
fancy-regex = "0.14"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1_smol = "1"
yaml-rust2 = { version = "0.10", default-features = false }

[profile.release]
strip = true
lto = "thin"
